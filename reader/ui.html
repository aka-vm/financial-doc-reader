<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Servicer Report Reader</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e4e3de;
    --ok: #1f7a4d; --ok-bg: #e8f5ee; --warn: #9a5b00; --warn-bg: #fdf3e1; --accent: #2b5fd9;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --card: #1f1f1d; --text: #ecebe6; --muted: #9b9a94; --line: #34332f;
            --ok: #5ccf94; --ok-bg: #16301f; --warn: #f0b45a; --warn-bg: #352812; --accent: #7aa2ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .settings { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .settings label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 2px; }
  select, input { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
                  background: var(--card); color: var(--text); min-width: 160px; }
  #drop { border: 2px dashed var(--line); border-radius: 12px; padding: 40px 16px; text-align: center;
          background: var(--card); cursor: pointer; transition: border-color .15s; }
  #drop.over { border-color: var(--accent); }
  #drop b { display: block; font-size: 17px; margin-bottom: 4px; }
  #drop span { color: var(--muted); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 16px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .head h2 { font-size: 16px; margin: 0; }
  .banner { margin: 12px 0; padding: 8px 12px; border-radius: 8px; font-weight: 600; }
  .banner.ok { background: var(--ok-bg); color: var(--ok); }
  .banner.warn { background: var(--warn-bg); color: var(--warn); }
  .muted { color: var(--muted); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; margin: 8px 0 4px; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; vertical-align: top; }
  th:first-child, td:first-child { text-align: left; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  td.flag { background: var(--warn-bg); color: var(--warn); }
  .why { display: block; font-size: 12px; font-weight: normal; }
  h3 { font-size: 13px; margin: 16px 0 0; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .scroll { overflow-x: auto; }
  button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line);
           background: var(--card); color: var(--text); cursor: pointer; }
  .err { color: var(--warn); }
</style>
</head>
<body>
<main>
  <h1>Servicer Report Reader</h1>
  <p class="sub">Drop a monthly auto-ABS servicer report. Every figure comes back either passing the arithmetic checks
    or flagged with the reason.</p>

  <div class="settings">
    <label>Model runs on
      <select id="backend">
        <option value="ollama">Ollama (this machine)</option>
        <option value="link">My server (link)</option>
        <option value="codex">Codex CLI</option>
        <option value="claude-code">Claude Code CLI</option>
        <option value="gemini-cli">Gemini CLI</option>
        <option value="anthropic">Anthropic API key</option>
        <option value="openai">OpenAI API key</option>
        <option value="gemini">Gemini API key</option>
      </select>
    </label>
    <label>Model <input id="model" placeholder="e.g. qwen3.5:9b"></label>
    <label id="urlbox">Server URL <input id="url" placeholder="http://my-server:8000/v1"></label>
  </div>

  <div id="drop"><b>Drop servicer reports here</b><span>.htm, .html, .txt or .pdf · or click to choose files</span><input id="pick" type="file" multiple hidden accept=".htm,.html,.txt,.pdf"></div>
  <div id="results"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const FIELDS = [
  ["trust", "Trust"], ["period_start", "Period start"], ["period_end", "Period end"], ["distribution_date", "Distribution date"],
  ["initial_pool_balance", "Initial pool balance"], ["pool_balance_beginning", "Pool balance, beginning"],
  ["pool_balance_ending", "Pool balance, ending"], ["receivables_count_ending", "Receivables outstanding"],
  ["gross_charge_offs", "Gross charge-offs"], ["recoveries", "Recoveries"], ["net_losses", "Net losses"],
  ["cumulative_net_losses", "Cumulative net losses"], ["cumulative_net_loss_pct", "Cumulative net loss %"],
  ["servicing_fee", "Servicing fee"], ["reserve_account_ending", "Reserve account, ending"],
  ["overcollateralization_ending", "Overcollateralization, ending"], ["excess_to_residual", "Released to residual holder"],
];
const fmt = (v, pct) => v === null || v === undefined ? "—" : typeof v === "number"
  ? (pct ? v + "%" : v.toLocaleString("en-US", Number.isInteger(v) ? {} : {minimumFractionDigits: 2, maximumFractionDigits: 2}))
  : String(v);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const cell = (v, flag, pct) => flag
  ? `<td class="flag">${esc(fmt(v, pct))}<span class="why">${esc(flag)}</span></td>`
  : `<td>${esc(fmt(v, pct))}</td>`;
const cls = c => String(c).toUpperCase().replace(/CLASS|NOTES?|\s/g, "");
const bucket = b => { const n = (String(b).match(/\d+/g) || []).map(Number);
  return !n.length ? String(b) : n[0] >= 120 ? "121+" : n.length > 1 ? `${n[0]}-${n[1]}` : String(n[0]); };

let saved = {};  // the viewer's own last choice wins over the server's defaults
try { saved = JSON.parse(localStorage.getItem("srr") || "{}"); } catch {}
for (const k of ["backend", "model", "url"]) if (saved[k]) $(k).value = saved[k];
fetch("/api/defaults").then(r => r.json()).then(d => {
  for (const k of ["backend", "model", "url"]) if (d[k] && !saved[k]) $(k).value = d[k];
  showUrl();
});
const save = () => { try { localStorage.setItem("srr", JSON.stringify({backend: $("backend").value, model: $("model").value, url: $("url").value})); } catch {} };
const showUrl = () => $("urlbox").style.display = $("backend").value === "link" ? "" : "none";
for (const k of ["backend", "model", "url"]) $(k).addEventListener("change", () => { save(); showUrl(); });
showUrl();

const drop = $("drop");
drop.onclick = () => $("pick").click();
$("pick").onchange = e => run([...e.target.files]);
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); run([...e.dataTransfer.files]); };

async function run(files) {
  files.sort((a, b) => a.name.localeCompare(b.name));  // month order for files named by date
  for (const f of files) await readOne(f);
}

async function readOne(file) {
  const card = document.createElement("div");
  card.className = "card";
  $("results").prepend(card);
  const t0 = Date.now();
  const tick = setInterval(() => card.innerHTML =
    `<div class="head"><h2>${esc(file.name)}</h2><span class="muted">reading… ${Math.round((Date.now() - t0) / 1000)}s</span></div>`, 500);
  const q = new URLSearchParams({backend: $("backend").value, model: $("model").value, url: $("url").value});
  try {
    const r = await fetch("/api/read?" + q, {method: "POST", headers: {"X-Filename": file.name}, body: file});
    const res = await r.json();
    clearInterval(tick);
    if (res.error) throw new Error(res.error);
    card.innerHTML = render(res, Math.round((Date.now() - t0) / 1000));
    card.querySelector("button").onclick = () => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([JSON.stringify(res, null, 1)], {type: "application/json"}));
      a.download = file.name.replace(/\.\w+$/, "") + ".json";
      a.click();
    };
  } catch (e) {
    clearInterval(tick);
    card.innerHTML = `<div class="head"><h2>${esc(file.name)}</h2></div><p class="err">${esc(e.message)}</p>`;
  }
}

function render(res, secs) {
  const d = res.report, fl = res.flags, n = Object.keys(fl).length;
  const banner = n ? `<div class="banner warn">${n} figure${n > 1 ? "s" : ""} flagged for review</div>`
                   : `<div class="banner ok">All figures pass the checks</div>`;
  const rows = FIELDS.map(([k, label]) => `<tr><td>${label}</td>${cell(d[k], fl[k], k.endsWith("_pct"))}</tr>`).join("");
  const notes = (d.notes || []).map(x => { const c = cls(x.class);
    return `<tr><td>${esc(x.class)}</td>${["beginning_balance", "principal_paid", "interest_paid", "ending_balance"]
      .map(f => cell(x[f], fl[`notes[${c}].${f}`])).join("")}</tr>`; }).join("");
  const dq = (d.delinquency || []).map(x => { const b = bucket(x.bucket);
    return `<tr><td>${esc(x.bucket)}</td>${cell(x.count, fl[`delinquency[${b}].count`])}${cell(x.balance, fl[`delinquency[${b}].balance`])}</tr>`; }).join("");
  return `<div class="head"><h2>${esc(d.trust || res.file)}</h2>
      <span class="muted">${esc(res.file)} · ${secs}s · <button>Download JSON</button></span></div>${banner}
    <div class="scroll"><table><tr><th>Figure</th><th>Value</th></tr>${rows}</table></div>
    <h3>Notes</h3><div class="scroll"><table><tr><th>Class</th><th>Beginning</th><th>Principal paid</th><th>Interest paid</th><th>Ending</th></tr>${notes}</table></div>
    <h3>Delinquency</h3><div class="scroll"><table><tr><th>Bucket</th><th>Count</th><th>Balance</th></tr>${dq}</table></div>`;
}
</script>
</body>
</html>
